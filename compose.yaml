services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    user: "${TRANS4NUM_CONTAINER_UID:-1000}:${TRANS4NUM_CONTAINER_GID:-1000}"
    environment:
      STORE_TYPE: local
      TRANS4NUM_OPTIMIZER_MAX_TIME_SECONDS: "${TRANS4NUM_OPTIMIZER_MAX_TIME_SECONDS:-120}"
      TRANS4NUM_OPTIMIZER_RELATIVE_GAP: "${TRANS4NUM_OPTIMIZER_RELATIVE_GAP:-0.05}"
      TRANS4NUM_OPTIMIZER_WORKERS: "${TRANS4NUM_OPTIMIZER_WORKERS:-8}"
      TRANS4NUM_OPTIMIZER_FAST_PATH: "${TRANS4NUM_OPTIMIZER_FAST_PATH:-true}"
      TRANS4NUM_OPTIMIZER_DEBUG: "${TRANS4NUM_OPTIMIZER_DEBUG:-false}"
    ports:
      - "8080:8080"
    volumes:
      - ./engine/data:/var/task/data
      - ./backend/src/data/simulations:/var/task/simulations
